name: Staging Deployment

on:
  push:
    branches:
      - stag
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Staging EC2
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to Staging EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAG_EC2_HOST }}
          username: ${{ secrets.STAG_EC2_USERNAME }}
          key: ${{ secrets.STAG_EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            echo "📁 Entering /promptOptimizer"
            cd /promptOptimizer

            # Repo was often created/updated with sudo/root — fix ownership for ubuntu git
            sudo chown -R ubuntu:ubuntu /promptOptimizer
            git config --global --add safe.directory /promptOptimizer

            echo "📥 Fetching and updating stag branch"
            git fetch origin stag
            git checkout stag
            git pull origin stag

            echo "🐳 Rebuilding app container only (postgres/redis untouched)"
            sudo docker compose up -d --build app

            echo "📊 Container status"
            sudo docker compose ps

            echo "🩺 Waiting for app to become healthy, then smoke check /docs"
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://localhost:8000/docs; then
                echo "Smoke check passed (attempt $i)"
                curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8000/docs
                echo "✅ Staging deployment completed successfully"
                exit 0
              fi
              echo "App not ready yet (attempt $i/30)..."
              sleep 2
            done

            echo "❌ App did not become ready in time"
            sudo docker compose logs app --tail 50
            exit 1

      - name: ✅ Deployment Summary
        if: success()
        run: |
          echo "🎉 Staging deployment successful"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"
          echo "🌿 Branch: stag"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "💥 Staging deployment failed"
          echo "Check the SSH step logs above"
          echo "Do NOT run docker compose down -v on the staging server"
